<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Parser Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;
    
    // Icon components
    const Upload = ({ className = "w-12 h-12 text-blue-500 mx-auto mb-2" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
    );
    
    const Download = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );
    
    const AlertCircle = ({ className = "w-5 h-5 text-red-600" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    
    const CheckCircle = ({ className = "w-5 h-5 text-green-600" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    
    const Loader = ({ className = "w-5 h-5 text-blue-600 animate-spin" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24">
        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    );

    function LogParserTool() {
      const [files, setFiles] = useState([]);
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [fileName, setFileName] = useState('');
      const [fileFormat, setFileFormat] = useState('xlsx');

      const parseLogFile = (fileContent) => {
        const lines = fileContent.split('\n');
        const dataMap = new Map();
        
        lines.forEach(line => {
          if (line.includes('[Hot Folder Subject Assign]')) {
            // Extract the assignment data with regex - handles negative numbers and missing online codes
            const match = line.match(/\[Hot Folder Subject Assign\]\s+([^:]+):([^:]+):(-?\d+):(-?\d*):(.+?)(?:", , {}|$)/);
            if (match) {
              const firstName = match[1].trim();
              const lastName = match[2].trim();
              const onlineCode = match[4].trim() || 'N/A';
              let imagePath = match[5].trim();
              
              // Extract just the filename from the path
              const imageFilename = imagePath.includes('\\') 
                ? imagePath.split('\\').pop() 
                : imagePath.split('/').pop();
              
              // Create unique key to avoid duplicates
              const uniqueKey = `${firstName}:${lastName}:${onlineCode}:${imageFilename}`;
              
              if (!dataMap.has(uniqueKey)) {
                dataMap.set(uniqueKey, {
                  'First Name': firstName,
                  'Last Name': lastName,
                  'Online Code': onlineCode,
                  'Image': imageFilename
                });
              }
            }
          }
        });
        
        return Array.from(dataMap.values());
      };

      const handleFileUpload = async (event) => {
        const uploadedFiles = Array.from(event.target.files);
        if (uploadedFiles.length === 0) return;

        setError('');
        setSuccess('');
        setLoading(true);

        try {
          const combinedData = new Map();
          let totalRecords = 0;

          for (const file of uploadedFiles) {
            const fileContent = await file.text();
            const parsedData = parseLogFile(fileContent);
            totalRecords += parsedData.length;

            // Add/merge data into the combined map
            parsedData.forEach(record => {
              const uniqueKey = `${record['First Name']}:${record['Last Name']}:${record['Online Code']}:${record['Image']}`;
              if (!combinedData.has(uniqueKey)) {
                combinedData.set(uniqueKey, record);
              }
            });
          }

          const mergedData = Array.from(combinedData.values());

          if (mergedData.length === 0) {
            setError('No Hot Folder Subject Assign entries found in any of the log files.');
            setData([]);
          } else {
            setData(mergedData);
            setSuccess(`Successfully parsed ${totalRecords} total records from ${uploadedFiles.length} log file(s). Combined into ${mergedData.length} unique records!`);
          }
          setFiles(uploadedFiles);
        } catch (err) {
          setError(`Error reading files: ${err.message}`);
          setData([]);
        } finally {
          setLoading(false);
        }
      };

      const downloadSpreadsheet = () => {
        if (data.length === 0) {
          setError('No data to download. Please upload a log file first.');
          return;
        }

        // Use custom filename or generate one with timestamp
        const timestamp = new Date().toISOString().split('T')[0];
        const finalFileName = fileName.trim() || `hot_folder_assignments_${timestamp}`;
        
        if (fileFormat === 'csv') {
          // Download as CSV
          const csv = Papa.unparse(data);
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          const url = URL.createObjectURL(blob);
          link.setAttribute('href', url);
          link.setAttribute('download', finalFileName.endsWith('.csv') ? finalFileName : `${finalFileName}.csv`);
          link.style.visibility = 'hidden';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } else {
          // Download as Excel
          const workbook = XLSX.utils.book_new();
          
          // Convert data to worksheet with formatting
          const worksheet = XLSX.utils.json_to_sheet(data);
          
          // Set column widths
          worksheet['!cols'] = [
            { wch: 15 },  // First Name
            { wch: 15 },  // Last Name
            { wch: 15 },  // Online Code
            { wch: 30 }   // Image
          ];

          XLSX.utils.book_append_sheet(workbook, worksheet, 'Hot Folder Assignments');
          
          const fileNameWithExt = finalFileName.endsWith('.xlsx') ? finalFileName : `${finalFileName}.xlsx`;
          XLSX.writeFile(workbook, fileNameWithExt);
        }
        
        setSuccess(`File downloaded successfully as ${fileFormat.toUpperCase()}!`);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
          <div className="max-w-4xl mx-auto">
            {/* Header */}
            <div className="text-center mb-8">
              <h1 className="text-4xl font-bold text-gray-800 mb-2">Log File Parser</h1>
              <p className="text-gray-600">Extract Hot Folder assignments and generate spreadsheets</p>
            </div>

            {/* Main Card */}
            <div className="bg-white rounded-lg shadow-xl p-8 mb-6">
              
              {/* File Upload Section */}
              <div className="mb-8">
                <label className="block mb-4">
                  <div className="border-2 border-dashed border-blue-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
                    <Upload />
                    <p className="text-lg font-semibold text-gray-700 mb-1">
                      Click to upload or drag and drop
                    </p>
                    <p className="text-sm text-gray-500">Log files (*.log)</p>
                    <input
                      type="file"
                      accept=".log,.txt"
                      onChange={handleFileUpload}
                      multiple
                      className="hidden"
                    />
                  </div>
                </label>
                {files.length > 0 && (
                  <div className="text-sm text-gray-600 mt-2">
                    <p className="font-semibold mb-2">Selected files ({files.length}):</p>
                    <ul className="list-disc list-inside space-y-1">
                      {Array.from(files).map((file, idx) => (
                        <li key={idx} className="text-gray-700">{file.name}</li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>

              {/* Status Messages */}
              {loading && (
                <div className="flex items-center gap-3 p-4 bg-blue-50 border border-blue-200 rounded-lg mb-6">
                  <Loader />
                  <span className="text-blue-700">Processing log file...</span>
                </div>
              )}

              {error && (
                <div className="flex items-center gap-3 p-4 bg-red-50 border border-red-200 rounded-lg mb-6">
                  <AlertCircle />
                  <span className="text-red-700">{error}</span>
                </div>
              )}

              {success && (
                <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg mb-6">
                  <CheckCircle />
                  <span className="text-green-700">{success}</span>
                </div>
              )}

              {/* Data Preview */}
              {data.length > 0 && (
                <div>
                  <div className="mb-4 p-4 bg-gray-50 rounded-lg">
                    <p className="text-sm font-semibold text-gray-700">
                      Total Records: <span className="text-blue-600">{data.length}</span>
                    </p>
                  </div>

                  {/* Table Preview */}
                  <div className="overflow-x-auto mb-6">
                    <table className="w-full text-sm border-collapse">
                      <thead>
                        <tr className="bg-blue-500 text-white">
                          <th className="px-4 py-2 text-left font-semibold">First Name</th>
                          <th className="px-4 py-2 text-left font-semibold">Last Name</th>
                          <th className="px-4 py-2 text-left font-semibold">Online Code</th>
                          <th className="px-4 py-2 text-left font-semibold">Image</th>
                        </tr>
                      </thead>
                      <tbody>
                        {data.slice(0, 10).map((row, index) => (
                          <tr key={index} className={index % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                            <td className="px-4 py-2 border-b border-gray-200">{row['First Name']}</td>
                            <td className="px-4 py-2 border-b border-gray-200">{row['Last Name']}</td>
                            <td className="px-4 py-2 border-b border-gray-200">{row['Online Code']}</td>
                            <td className="px-4 py-2 border-b border-gray-200 truncate">{row['Image']}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {data.length > 10 && (
                    <p className="text-xs text-gray-500 mb-4">
                      Showing first 10 of {data.length} records
                    </p>
                  )}

                  {/* Download Section */}
                  <div className="space-y-3">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        File Name (optional)
                      </label>
                      <input
                        type="text"
                        value={fileName}
                        onChange={(e) => setFileName(e.target.value)}
                        placeholder="hot_folder_assignments_2025-11-27"
                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                      />
                      <p className="text-xs text-gray-500 mt-1">Leave blank to use default name with today's date</p>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        File Format
                      </label>
                      <div className="flex gap-4">
                        <label className="flex items-center cursor-pointer">
                          <input
                            type="radio"
                            value="xlsx"
                            checked={fileFormat === 'xlsx'}
                            onChange={(e) => setFileFormat(e.target.value)}
                            className="mr-2"
                          />
                          <span className="text-sm text-gray-700">Excel (.xlsx)</span>
                        </label>
                        <label className="flex items-center cursor-pointer">
                          <input
                            type="radio"
                            value="csv"
                            checked={fileFormat === 'csv'}
                            onChange={(e) => setFileFormat(e.target.value)}
                            className="mr-2"
                          />
                          <span className="text-sm text-gray-700">CSV (.csv)</span>
                        </label>
                      </div>
                    </div>
                    
                    <button
                      onClick={downloadSpreadsheet}
                      className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2"
                    >
                      <Download />
                      Download as {fileFormat.toUpperCase()}
                    </button>
                  </div>
                </div>
              )}

              {/* Empty State */}
              {!loading && data.length === 0 && !error && (
                <div className="text-center py-12">
                  <p className="text-gray-500">Upload a log file to get started</p>
                </div>
              )}
            </div>

            {/* Info Footer */}
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
              <p className="text-sm text-gray-700">
                <span className="font-semibold">How it works:</span> Upload one or more renderer log files. The tool will extract all Hot Folder Subject Assign entries, combine and deduplicate the data, then generate a formatted Excel spreadsheet or CSV with First Name, Last Name, Online Code, and Image filename.
              </p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<LogParserTool />, document.getElementById('root'));
  </script>
</body>
</html>
